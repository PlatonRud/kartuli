<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kartuli — грузинские слова</title>

  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- iOS: запуск с домашнего экрана без интерфейса Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kartuli">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="preload" href="fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <!-- Вкладка «Изучение»: выбор темы -->
    <section id="topics" class="screen">
      <h1 class="title">Kartuli</h1>

      <div class="segments">
        <button id="tab-all" class="segment" type="button">Все темы</button>
        <button id="tab-favorites" class="segment" type="button">Избранное</button>
      </div>

      <ul id="topic-list" class="scroll topic-list"></ul>
      <p id="topics-empty" class="empty" hidden>В избранном пока пусто. Откройте тему и нажмите на сердечко, чтобы добавить её сюда.</p>
    </section>

    <!-- Вкладка «Словарь»: поиск по всем словам -->
    <section id="dictionary" class="screen" hidden>
      <h1 class="title">Словарь</h1>

      <label class="search">
        <input id="search" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" placeholder="Поиск слова" aria-label="Поиск слова">
        <span class="search-icon" aria-hidden="true"></span>
      </label>

      <ul id="word-list" class="scroll word-list"></ul>
      <p id="words-empty" class="empty" hidden>Ничего не найдено</p>
    </section>

    <!-- Карточки выбранной темы -->
    <section id="study" class="screen study" hidden>
      <header class="bar">
        <button id="back" class="glass glass-btn" type="button" aria-label="Назад к темам">
          <span class="icon-chevron" aria-hidden="true"></span>
        </button>
        <h1 id="deck-title" class="bar-title"></h1>
        <div class="glass glass-group">
          <button id="direction" type="button">
            <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/></svg>
          </button>
          <button id="favorite" class="heart" type="button">
            <svg viewBox="0 0 24 24" width="23" height="23" stroke-width="2.3" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5l-1.3-1.2C5.9 15 3 12.300 3 8.900 3 6.200 5.100 4.200 7.700 4.200c1.600 0 3.200.8 4.300 2 1.100-1.200 2.700-2 4.300-2C18.900 4.200 21 6.200 21 8.900c0 3.400-2.900 6.100-7.700 10.400L12 20.500z"/></svg>
          </button>
        </div>
      </header>

      <div class="progress">
        <div class="progress-track"><div id="bar" class="progress-bar"></div></div>
        <span id="count" class="progress-count"></span>
      </div>

      <div class="stage">
        <div id="card" class="card" role="button" tabindex="0" aria-label="Карточка, нажмите, чтобы перевернуть">
          <div class="card-inner">
            <div class="face front">
              <span id="front-main" class="main"></span>
              <span class="hint">нажмите, чтобы перевернуть</span>
            </div>
            <div class="face back">
              <span id="back-top" class="top-word"></span>
              <span id="back-main" class="main"></span>
              <span id="back-sub" class="badge badge-lg"></span>
            </div>
          </div>
        </div>

        <div id="done" class="done" hidden>
          <p class="done-title">Тема пройдена</p>
          <p class="done-text">Все слова здесь отмечены как выученные.</p>
          <button id="restart" class="btn btn-primary" type="button">Повторить заново</button>
          <button id="to-topics" class="btn btn-secondary" type="button">К темам</button>
        </div>
      </div>

      <footer id="actions" class="actions">
        <button id="again" class="btn btn-secondary" type="button">Ещё учу</button>
        <button id="know" class="btn btn-primary" type="button">Знаю</button>
      </footer>
    </section>

    <div id="fade" class="fade" aria-hidden="true"></div>
    <nav id="tabbar" class="glass tabbar" aria-label="Разделы">
      <button id="nav-topics" class="tab" type="button">
        <span class="tab-icon"><img src="img/tab-learn.svg" alt=""></span>
        <span class="tab-label">Изучение</span>
      </button>
      <button id="nav-dictionary" class="tab" type="button">
        <span class="tab-icon"><img src="img/tab-search.svg" alt=""></span>
        <span class="tab-label">Словарь</span>
      </button>
    </nav>
  </main>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
